<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirunation ♡ Perú × Chile</title>
<meta name="description" content="Chirunation: celebrando los lazos entre Perú y Chile. Concursos, el MAP Chirú, la playlist y las historias que nos unen.">
<meta property="og:title" content="Chirunation ♡">
<meta property="og:description" content="Celebrando los lazos entre Perú y Chile.">
<meta property="og:image" content="assets/img/chiru-playa.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 21 4.5 13.6A4.8 4.8 0 0 1 12 7.4a4.8 4.8 0 0 1 7.5 6.2z' fill='%23ff5c74'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<!--

<div class="franja" aria-hidden="true"><i class="pe"></i><i class="bl"></i><i class="pe"></i><i class="cl-a"></i><i class="bl"></i><i class="cl-r"></i></div>

<!-- ============ BARRA DE ARRIBA ============ -->
<header class="barra">
  <div class="banderas" role="img" aria-label="Bandera de Perú y bandera de Chile">
    <svg width="34" height="24" viewBox="0 0 36 24" aria-hidden="true"><rect width="12" height="24" fill="#D91023"/><rect x="12" width="12" height="24" fill="#fff"/><rect x="24" width="12" height="24" fill="#D91023"/></svg>
    <svg class="latido" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 4.5 13.6A4.8 4.8 0 0 1 12 7.4a4.8 4.8 0 0 1 7.5 6.2z" fill="#ff5c74"/></svg>
    <svg width="34" height="24" viewBox="0 0 36 24" aria-hidden="true"><rect width="36" height="12" fill="#fff"/><rect y="12" width="36" height="12" fill="#D52B1E"/><rect width="12" height="12" fill="#0039A6"/><polygon points="6,2.2 7.2,5.4 10.6,5.5 7.9,7.6 8.9,10.8 6,8.9 3.1,10.8 4.1,7.6 1.4,5.5 4.8,5.4" fill="#fff"/></svg>
  </div>
  <div class="cinta"><span class="cinta-texto" id="cinta"></span></div>
  <div id="boton-barra"></div>
</header>

<!-- ============ CUERPO PRINCIPAL ============ -->
<div class="layout">

  <!-- Columna izquierda: concursos, MAP, cita -->
  <aside class="col col-izq" aria-label="Concursos, MAP y cita">
    <section class="card" id="concursos"></section>
    <section class="card" id="map"></section>
    <figure class="cita" id="cita"></figure>
  </aside>

  <!-- Centro: título, burbujas, planeta y juego -->
  <main class="centro">
    <h1 class="sr-only" id="titulo-sr">Chirunation</h1>
    <svg class="titulo" viewBox="0 0 600 200" aria-hidden="true">
      <defs>
        <path id="arcoArriba" d="M 20 270 A 290 250 0 0 1 580 270"/>
        <path id="arcoGrande" d="M 70 290 A 240 205 0 0 1 530 290"/>
      </defs>
      <text class="t-sub"><textPath href="#arcoArriba" startOffset="50%" text-anchor="middle" id="t-sub"></textPath></text>
      <text class="t-sombra" transform="translate(0,6)"><textPath href="#arcoGrande" startOffset="50%" text-anchor="middle" class="t-main"></textPath></text>
      <text class="t-frente"><textPath href="#arcoGrande" startOffset="50%" text-anchor="middle" class="t-main"></textPath></text>
      <path class="destello" d="M40 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path class="destello d2" d="M556 110 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    </svg>

    <div class="mundo">
      <div id="burbujas"></div>
      <svg class="globo" viewBox="0 0 500 500" role="img" aria-label="Mapa ilustrado del Pacífico: un barquito con un corazón navega de Lima a Santiago junto a la costa de Perú y Chile">

          <radialGradient id="oc" cx="35%" cy="30%" r="78%"><stop offset="0" stop-color="#c4ecff"/><stop offset=".48" stop-color="#5aa8e8"/><stop offset="1" stop-color="#2a3f8f"/></radialGradient>
          <radialGradient id="rim" cx="50%" cy="50%" r="50%"><stop offset=".75" stop-color="#2a3f8f" stop-opacity="0"/><stop offset="1" stop-color="#2a3f8f" stop-opacity=".5"/></radialGradient>
          <clipPath id="clipGlobo"><circle cx="250" cy="250" r="230"/></clipPath>
        </defs>
        <circle cx="250" cy="250" r="242" fill="#ffffff" fill-opacity=".18"/>
        <circle cx="250" cy="250" r="230" fill="url(#oc)" stroke="#ffffff" stroke-width="6"/>
        <g clip-path="url(#clipGlobo)">
          <g fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round">
            <path d="M70 170 q10 -9 20 0 t20 0"/><path d="M120 115 q10 -9 20 0 t20 0"/><path d="M60 300 q10 -9 20 0 t20 0"/><path d="M150 385 q10 -9 20 0 t20 0"/><path d="M205 195 q10 -9 20 0 t20 0"/><path d="M240 435 q10 -9 20 0 t20 0"/><path d="M110 240 q10 -9 20 0 t20 0"/>
          </g>
          <g fill="#ffffff" fill-opacity=".55"><circle cx="90" cy="360" r="5"/><circle cx="102" cy="346" r="3"/><circle cx="200" cy="150" r="4"/><circle cx="170" cy="460" r="4"/></g>
          <path d="M370 0 L362 70 L384 140 L425 200 L500 215 L500 0 Z" fill="#9fd49a"/>

          <g fill="#ffffff"><circle cx="350" cy="60" r="5"/><circle cx="352" cy="160" r="5"/><circle cx="400" cy="240" r="5"/><circle cx="423" cy="330" r="5"/><circle cx="420" cy="400" r="6"/><circle cx="426" cy="455" r="5"/></g>
          <circle cx="250" cy="250" r="230" fill="url(#rim)"/>
        </g>
        <g transform="translate(110 118)" opacity=".85">
          <circle r="22" fill="#ffffff" fill-opacity=".25"/>
          <polygon points="0,-20 4,-4 20,0 4,4 0,20 -4,4 -20,0 -4,-4" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="0,-20 4,-4 0,0" fill="#ff5c74"/>
        </g>
        <path d="M342 212 C 240 236, 240 364, 389 390" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
        <g transform="translate(342 212)"><circle r="13" fill="#ff5c74" stroke="#fff" stroke-width="4"/><circle r="4" fill="#fff"/></g>
        <g transform="translate(389 390)"><circle r="13" fill="#4f7dff" stroke="#fff" stroke-width="4"/><circle r="4" fill="#fff"/></g>
        <g transform="translate(250 196)"><rect x="-6" y="-20" width="76" height="30" rx="15" fill="#fff8ef"/><text x="32" y="1" text-anchor="middle" class="g-label lima">Lima</text></g>
        <g transform="translate(270 418)"><rect x="-8" y="-20" width="110" height="30" rx="15" fill="#fff8ef"/><text x="47" y="1" text-anchor="middle" class="g-label stgo">Santiago</text></g>
        <g transform="translate(276 300)">
          <g class="balanceo">
            <path d="M-26 4 Q0 10 26 4 Q20 20 0 20 Q-20 20 -26 4 Z" fill="#ffffff" stroke="#2a3f8f" stroke-width="3" stroke-linejoin="round"/>
            <line x1="0" y1="6" x2="0" y2="-34" stroke="#2a3f8f" stroke-width="3" stroke-linecap="round"/>
            <path d="M-3 -32 Q-14 -14 -3 0 L-22 0 Q-16 -18 -3 -32 Z" fill="#ff8fa2" stroke="#2a3f8f" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M3 -34 Q16 -16 3 0 L23 0 Q18 -18 3 -34 Z" fill="#8fb2ff" stroke="#2a3f8f" stroke-width="2.5" stroke-linejoin="round"/>
            <path class="latido" d="M0 -42 C -3 -47, -14 -48, -14 -57 C -14 -64, -5 -66, 0 -60 C 5 -66, 14 -64, 14 -57 C 14 -48, 3 -47, 0 -42 Z" fill="#ff5c74" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- Juego: Perú y Chile en pixel (lógica en js/juego.js) -->
    <section class="card juego" aria-labelledby="juego-titulo">
      <div class="juego-cabecera">
        <h2 id="juego-titulo"></h2>
        <button type="button" class="btn-mini" id="juego-reiniciar" aria-label="Reiniciar el juego">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Reiniciar
        </button>
      </div>
      <p class="juego-instrucciones" id="juego-instrucciones"></p>
      <div class="escenario" id="escenario">
        <div class="mesa" aria-hidden="true"><div class="mesa-tabla"><span id="item-nombre"></span></div><i class="pata p1"></i><i class="pata p2"></i></div>
        <button type="button" class="flecha izq" id="item-ant" aria-label="Objeto anterior">‹</button>
        <button type="button" class="flecha der" id="item-sig" aria-label="Objeto siguiente">›</button>
      </div>
      <p class="sr-only" id="juego-estado" aria-live="polite"></p>
    </section>
  </main>

  <!-- Columna derecha: enlaces y lo último -->
  <aside class="col col-der" aria-label="Enlaces y lo último">
    <div class="card pase">
      <div class="pase-ruta">
        <div class="pase-mitad pe"><small>DESDE</small><b>LIM</b><span>Lima, Perú</span></div>
        <div class="pase-mitad cl"><small>HACIA</small><b>SCL</b><span>Santiago, Chile</span></div>
      </div>
      <div class="pase-info"><span>PASE A BORDO ♡</span><span>ASIENTO 1A · VISTA AL MAR</span></div>
      <div class="pase-cuerpo">
        <h2>Enlaces</h2>
        <nav aria-label="Redes y enlaces" id="enlaces"></nav>
      </div>
      <div class="codigo-barras" aria-hidden="true"></div>
    </div>
    <section class="card" id="ultimo" aria-labelledby="ultimo-titulo"></section>
  </aside>
</div>

<!-- ============ ABAJO: LIBRO, FOTO, PLAYLIST ============ -->
<section class="abajo" aria-labelledby="abajo-titulo">
  <h2 id="abajo-titulo" class="titulo-seccion"></h2>
  <div class="abajo-fila">
    <div class="card libro" id="libro"></div>
    <figure class="polaroid" id="foto"></figure>
    <section class="card playlist" id="playlist"></section>
  </div>
</section>

<footer class="pie" id="pie"></footer>

<!-- ============ VENTANITAS (se llenan desde contenido.js) ============ -->
<dialog class="ventana" id="ventana-calendario" aria-labelledby="cal-titulo">
  <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button>
  <h2 id="cal-titulo">Calendario Chirú</h2>
  <p class="ventana-sub">Fechas importantes del año para la ship ♡</p>
  <ol class="fechas" id="fechas"></ol>
</dialog>

<dialog class="ventana" id="ventana-chiru" aria-labelledby="chiru-titulo">
  <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button>
  <div id="chiru-contenido"></div>
</dialog>

<dialog class="ventana" id="ventana-proyectos" aria-labelledby="proy-titulo">
  <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button>
  <h2 id="proy-titulo">Proyectos Chirú</h2>
  <p class="ventana-sub">Lo que hemos creado juntxs ♡</p>
  <ul class="fechas" id="lista-proyectos"></ul>
</dialog>

</body>
